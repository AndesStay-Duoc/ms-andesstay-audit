server:
  port: 8084

spring:
  application:
    name: ms-andesstay-audit
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/andesstay?useSSL=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  kafka:
    # Lo único que se configura aquí es dónde está el clúster. Deserializers, grupo, confirmación
    # manual, paquetes de confianza, concurrencia y reintentos viven en config/KafkaConsumerConfig
    # y config/KafkaErrorConfig, comentados uno a uno: son decisiones de diseño del consumidor y no
    # parámetros de entorno.
    #
    # Los tres brokers del clúster local (infra/kafka/compose.yml), no solo el primero. El bootstrap
    # solo sirve para descubrir el clúster, pero si la única dirección listada está caída al
    # arrancar, el servicio no descubre nada aunque los otros dos estén en pie. Mismo valor que
    # ms-andesstay-kafka. En contenedor manda KAFKA_BOOTSTRAP, con los listeners internos.
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9093,localhost:9094}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Firma (JWKS), vigencia, issuer y audience del JWT de Azure AD
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/v2.0
          jwk-set-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:055d11d1-8ae0-4221-a6f7-b50be0a623b4}/discovery/v2.0/keys
          # Azure AD puede emitir aud como api://<clientId> o como el GUID del clientId
          audiences:
            - api://${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}
            - ${AZURE_CLIENT_ID:704a544f-3d92-44f5-aef9-8559574cff34}

andesstay:
  kafka:
    # Permite arrancar el servicio sin clúster de Kafka: apaga la topología de Streams y, con
    # listener.auto-startup en false, también el consumidor. La API de consulta del timeline sigue
    # sirviendo lo que ya haya en la base.
    enabled: ${ANDESSTAY_KAFKA_ENABLED:true}
    topics:
      reservations-events: reservations.events
      audit-timeline: audit.timeline
    groups:
      # Un grupo por responsabilidad. El de la topología de Streams es su application-id, que Kafka
      # trata como un consumer group más y se ve igual en Kafka UI.
      audit-timeline: audit-timeline-group
    streams:
      application-id: audit-timeline-streams
      # Streams guarda aquí su estado local. En el contenedor apunta a un volumen: sin él, cada
      # reinicio obliga a reconstruirlo desde el tema.
      state-dir: ${KAFKA_STREAMS_STATE_DIR:./target/kafka-streams}
